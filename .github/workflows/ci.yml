name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: >-
    ci-${{ github.event_name == 'pull_request'
      && format('pr-{0}', github.event.pull_request.number)
      || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  route:
    name: change routing · report-only
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.route.outputs.mode }}
      decision: ${{ steps.route.outputs.decision }}
      proposed_jobs: ${{ steps.route.outputs.proposed_jobs }}
      enforced_jobs: ${{ steps.route.outputs.enforced_jobs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute fail-closed proposed route
        id: route
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p target/change-routing
          route_args=()
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            route_head="${PR_HEAD_SHA:-HEAD}"
            if git rev-parse --verify -q "${PR_BASE_SHA}^{commit}" >/dev/null &&
               git rev-parse --verify -q "${route_head}^{commit}" >/dev/null &&
               git diff --name-status -z --find-renames \
                 "$PR_BASE_SHA" "$route_head" \
                 > target/change-routing/changes.z; then
              route_args+=(--changes-z target/change-routing/changes.z)
            else
              rm -f target/change-routing/changes.z
            fi
          fi
          python3 scripts/ci/change_routing.py route \
            --event "$GITHUB_EVENT_NAME" \
            "${route_args[@]}" \
            --output target/change-routing/route.json \
            --summary target/change-routing/route.md \
            --github-output "$GITHUB_OUTPUT"
          cat target/change-routing/route.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload proposed routing evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: change-routing-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/change-routing
          if-no-files-found: error
          retention-days: 30

  test:
    name: policy · lint · rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: gate · change-routing-selftest
        run: ./scripts/check-ci-local.sh --gate change-routing-selftest
      - name: gate · corpus-prune-selftest
        run: ./scripts/check-ci-local.sh --gate corpus-prune-selftest
      - name: gate · corpus-verify-selftest
        run: ./scripts/check-ci-local.sh --gate corpus-verify-selftest
      - name: gate · semantic-pack-pricing
        run: ./scripts/check-ci-local.sh --gate semantic-pack-pricing
      - name: gate · type4-frontier
        run: ./scripts/check-ci-local.sh --gate type4-frontier
      - name: gate · evidence-artifacts
        run: ./scripts/check-ci-local.sh --gate evidence-artifacts
      - name: gate · missed-worthy-frontier
        run: ./scripts/check-ci-local.sh --gate missed-worthy-frontier
      - name: gate · accepted-pair-coverage
        run: ./scripts/check-ci-local.sh --gate accepted-pair-coverage
      - name: gate · cargo-target-prune-selftest
        run: ./scripts/check-ci-local.sh --gate cargo-target-prune-selftest
      - name: gate · shell-lint
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          ./scripts/check-ci-local.sh --gate shell-lint
      - name: gate · format
        run: ./scripts/check-ci-local.sh --gate format
      - name: gate · file-length
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            ratchet_base="origin/${GITHUB_BASE_REF}"
          else
            ratchet_base="${PUSH_BEFORE:-HEAD^}"
            if [ -z "$ratchet_base" ] || [[ "$ratchet_base" =~ ^0+$ ]]; then
              ratchet_base="HEAD^"
            fi
            if ! git rev-parse --verify -q "$ratchet_base^{commit}" >/dev/null; then
              ratchet_base="HEAD^"
            fi
          fi
          ./scripts/check-ci-local.sh --gate file-length "$ratchet_base"
      - name: gate · legacy-prelude
        run: ./scripts/check-ci-local.sh --gate legacy-prelude
      - name: gate · clippy
        run: ./scripts/check-ci-local.sh --gate clippy
      - name: gate · doc
        run: ./scripts/check-ci-local.sh --gate doc

  release-product:
    name: optimized product contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: gate · build-release
        run: ./scripts/check-ci-local.sh --gate build-release
      - name: gate · product-query-schema
        run: ./scripts/check-ci-local.sh --gate product-query-schema target/release/nose
      - name: gate · semantic-pack-examples
        run: ./scripts/check-ci-local.sh --gate semantic-pack-examples target/release/nose
      - name: gate · type4-executable
        run: ./scripts/check-ci-local.sh --gate type4-executable target/release/nose
      - name: gate · type4-axis-language
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          ratchet_base="${PR_BASE_SHA:-${PUSH_BEFORE:-HEAD^}}"
          if [ -z "$ratchet_base" ] || [[ "$ratchet_base" =~ ^0+$ ]] || \
             ! git rev-parse --verify -q "$ratchet_base^{commit}" >/dev/null; then
            ratchet_base="HEAD^"
          fi
          ./scripts/check-ci-local.sh --gate type4-axis-language target/release/nose "$ratchet_base"
      - name: gate · duplication
        run: ./scripts/check-ci-local.sh --gate duplication

  workspace-tests-pr:
    name: workspace tests · ci-test profile
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: gate · test-ci-compile
        run: ./scripts/check-ci-local.sh --gate test-ci-compile
      - name: gate · test-ci
        run: ./scripts/check-ci-local.sh --gate test-ci

  workspace-tests-protected:
    name: workspace tests · release profile
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: gate · test-release-compile
        run: ./scripts/check-ci-local.sh --gate test-release-compile
      - name: gate · test-release
        run: ./scripts/check-ci-local.sh --gate test-release

  default-head-evidence:
    name: default-head evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gate · default-head-evidence
        run: ./scripts/check-ci-local.sh --gate default-head-evidence

  divergence-evidence:
    name: divergence evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gate · divergence-evidence
        run: ./scripts/check-ci-local.sh --gate divergence-evidence

  surface-recall-evidence:
    name: generated surface · recall evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gate · surface-recall-evidence
        run: ./scripts/check-ci-local.sh --gate surface-recall-evidence

  runtime-soundness-evidence:
    name: runtime · soundness evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gate · runtime-soundness-evidence
        run: ./scripts/check-ci-local.sh --gate runtime-soundness-evidence

  semantic-regression:
    name: semantic output · runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: select comparison and route bounded smoke
        id: route
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="$PR_BASE_SHA"
          if [ -z "$base" ]; then
            base="$PUSH_BEFORE"
          fi
          if [ -n "$base" ] && ! [[ "$base" =~ ^0+$ ]] && \
             ! git rev-parse --verify -q "$base^{commit}" >/dev/null; then
            git fetch --no-tags --depth=1 origin "$base" || true
          fi
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]] || \
             ! git rev-parse --verify -q "$base^{commit}" >/dev/null; then
            base="HEAD^"
          fi
          relevant="$(scripts/semantic-regression-smoke.sh \
            --base-ref "$base" --head-ref HEAD --relevance-only)"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

      - if: steps.route.outputs.relevant == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: cache pinned semantic smoke corpus
        if: steps.route.outputs.relevant == 'true'
        uses: actions/cache@v6
        with:
          path: bench/semantic-regression-repos
          key: semantic-regression-corpus-${{ hashFiles('bench/goldens/corpus.json', 'bench/semantic_regression_corpus.v1.json', 'bench/setup_repos.sh', 'bench/prune_corpus.py', 'bench/corpus_prune/**/*.py', 'bench/labels/prune_manifest.json') }}

      - if: steps.route.outputs.relevant == 'true'
        uses: Swatinem/rust-cache@v2

      - name: compare base and head on pinned subset
        if: steps.route.outputs.relevant == 'true'
        env:
          NOSE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          scripts/semantic-regression-smoke.sh \
            --base-ref "${{ steps.route.outputs.base }}" \
            --head-ref HEAD \
            --repos-root bench/semantic-regression-repos \
            --artifact-dir target/semantic-regression/artifacts

      - name: upload semantic regression evidence
        if: ${{ always() && steps.route.outputs.relevant == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: semantic-regression-${{ github.run_id }}
          path: target/semantic-regression/artifacts
          if-no-files-found: error

  coverage:
    name: test coverage (llvm-cov)
    # Coverage is a QUALITY ratchet. It is slower than the core `test` job, but
    # it must run before merge/release so a coverage dip cannot land first and be
    # fixed forward later.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      # Prebuilt binary — no compile cost.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Line-coverage ratchet. The bar starts lenient; raise the shared
      # threshold over time as coverage improves.
      - name: gate · coverage
        run: ./scripts/check-ci-local.sh --gate coverage

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Read the MSRV from Cargo.toml so this job never drifts from the declared value.
      - id: msrv
        run: echo "v=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*\"(.*)\".*/\1/')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.v }}
      - uses: Swatinem/rust-cache@v2
      # The shared gate reads Cargo.toml and uses `+toolchain`, overriding
      # rust-toolchain.toml so we really test the MSRV.
      - name: gate · msrv
        run: ./scripts/check-ci-local.sh --gate msrv

  supply-chain:
    name: unused-deps · advisories · licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Prebuilt binaries — no compile cost.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete,cargo-deny
      - name: gate · supply-chain
        run: ./scripts/check-ci-local.sh --gate supply-chain

  docs:
    name: docs wiki connectivity (awiki)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      # awiki lints the docs/ wiki: fails on orphan pages or disconnected islands.
      - name: install awiki
        run: go install github.com/corca-ai/awiki/cmd/awiki@v0.1.4
      - name: gate · docs
        run: ./scripts/check-ci-local.sh --gate docs

  formal:
    name: formal obligations · lean proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The formal obligation registry maps proof-sensitive semantic surfaces to Lean
      # proof files and counterexamples. Shared Lean models are compiled under target/lean;
      # each proof must type-check with warnings promoted to errors. See formal/README.md.
      - name: install elan (lean toolchain)
        run: |
          toolchain="$(cat lean-toolchain)"
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$toolchain"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: gate · formal-obligations
        run: ./scripts/check-ci-local.sh --gate formal-obligations
      - name: gate · formal-lean
        run: ./scripts/check-ci-local.sh --gate formal-lean

  hosted-timing:
    name: hosted CI timing
    if: ${{ always() }}
    needs:
      - test
      - release-product
      - workspace-tests-pr
      - workspace-tests-protected
      - default-head-evidence
      - divergence-evidence
      - surface-recall-evidence
      - runtime-soundness-evidence
      - semantic-regression
      - coverage
      - msrv
      - supply-chain
      - docs
      - formal
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch Actions timing metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target/hosted-ci
          mkdir -p target/hosted-ci/history-jobs
          gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            > target/hosted-ci/jobs.json
          gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?status=success&event=${GITHUB_EVENT_NAME}&per_page=20" \
            > target/hosted-ci/runs.json
          jq -r '.workflow_runs[].id' target/hosted-ci/runs.json |
            while read -r historical_run_id; do
              gh api --method GET \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${historical_run_id}/jobs?per_page=100" \
                > "target/hosted-ci/history-jobs/${historical_run_id}.json"
            done

      - name: Build and validate hosted timing receipt
        run: |
          python3 scripts/ci/hosted_timing.py --self-test
          python3 scripts/ci/hosted_timing.py \
            --jobs target/hosted-ci/jobs.json \
            --runs target/hosted-ci/runs.json \
            --history-jobs target/hosted-ci/history-jobs \
            --output target/hosted-ci/receipt.json \
            --summary target/hosted-ci/summary.md \
            --repository "$GITHUB_REPOSITORY" \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --head-sha "$GITHUB_SHA" \
            --event "$GITHUB_EVENT_NAME" \
            --runner-os "$RUNNER_OS" \
            --runner-arch "$RUNNER_ARCH" \
            --image-os "${ImageOS:-}" \
            --image-version "${ImageVersion:-}"
          python3 scripts/ci/hosted_timing.py \
            --validate target/hosted-ci/receipt.json
          cat target/hosted-ci/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload hosted timing evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: hosted-ci-timing-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/hosted-ci
          if-no-files-found: error
          retention-days: 30

  qualification:
    name: repository qualification
    if: ${{ always() }}
    needs:
      - route
      - test
      - release-product
      - workspace-tests-pr
      - workspace-tests-protected
      - default-head-evidence
      - divergence-evidence
      - surface-recall-evidence
      - runtime-soundness-evidence
      - semantic-regression
      - coverage
      - msrv
      - supply-chain
      - docs
      - formal
      - hosted-timing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify selected results and aggregate qualification
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          ROUTING_MODE: ${{ needs.route.outputs.mode }}
          ENFORCED_JOBS_JSON: ${{ needs.route.outputs.enforced_jobs }}
        run: |
          mkdir -p target/change-routing
          qualification_status=0
          python3 scripts/ci/qualification.py \
            --event "$GITHUB_EVENT_NAME" \
            --mode "$ROUTING_MODE" \
            --enforced-jobs "$ENFORCED_JOBS_JSON" \
            --output target/change-routing/qualification.json \
            --summary target/change-routing/qualification.md \
            || qualification_status=$?
          cat target/change-routing/qualification.md >> "$GITHUB_STEP_SUMMARY"
          exit "$qualification_status"

      - name: Upload qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: repository-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/change-routing
          if-no-files-found: error
          retention-days: 30
