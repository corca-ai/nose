id = "normalize.css.color"
kind = "soundness"
summary = "Parsed CSS color aliases, short hex, and opaque-alpha spellings canonicalize to the same RGBA denotation."

[claim]
id = "nose.claim.normalize.css.color"

[theorem]
status = "proven"
statement = "Canonicalizing a parsed color spelling preserves its modeled RGBA value."
model = "Lean models color spellings after successful parsing as alternate constructors over one RGBA value."

[preconditions.parser_table_correspondence]
kind = "runtime"
status = "empirical"
summary = "The Rust hex/rgb parsers and named-color table must map source tokens to the RGBA value used by the theorem."
evidence = ["crates/nose-normalize/src/css_value/tests.rs"]

[product]
surface = "canonicalization"
guarantee = "Only successfully parsed exact color spellings receive a shared canonical token."

[evidence]
executable_tests = ["crates/nose-normalize/src/css_value/tests.rs", "bench/type4/declarative_claim_matrix.v1.json"]
counterexamples = ["bench/type4/declarative_claim_matrix.v1.json#css.color.canonical-spelling.hn.1", "bench/type4/declarative_claim_matrix.v1.json#css.color.canonical-spelling.hn.2"]

[rust]
files = ["crates/nose-normalize/src/css_value.rs"]
symbols = ["normalize_color", "canonical_hex", "parse_rgb_func", "named_color"]

[lean]
proof = "Proof.lean"
theorems = ["NoseCssColor.canonicalize_preserves_rgba", "NoseCssColor.alias_spellings_agree"]
