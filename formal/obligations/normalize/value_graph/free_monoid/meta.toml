id = "normalize.value_graph.free_monoid"
kind = "soundness-boundary"
summary = "String/list builder semantics are ordered free-monoid concatenation, not commutative algebra."

[claim]
id = "nose.claim.normalize.value_graph.free_monoid"

[theorem]
status = "proven"
statement = "String/list builder semantics are ordered free-monoid concatenation, not commutative algebra."
model = "The Lean declarations listed in [lean] define the modeled theorem boundary."

[preconditions.ordered_concat_domain]
kind = "runtime"
status = "empirical"
summary = "Rust admission must distinguish ordered string/list concatenation from commutative numeric addition."
evidence = ["crates/nose-cli/tests/equivalence.rs"]

[preconditions.element_order_and_effects]
kind = "runtime"
status = "empirical"
summary = "Builder elements remain in source order and no observable append/evaluation effect is reordered."
evidence = ["crates/nose-cli/tests/equivalence.rs"]

[product]
surface = "exact-normalization"
guarantee = "Shares an exact fingerprint only when the recorded runtime preconditions admit the modeled theorem."

[evidence]
executable_tests = ["crates/nose-cli/tests/equivalence.rs"]
counterexamples = ["formal/obligations/normalize/value_graph/free_monoid/Counterexamples.lean#NoseFreeMonoidCounterexamples.concat_not_commutative", "formal/obligations/normalize/value_graph/free_monoid/Counterexamples.lean#NoseFreeMonoidCounterexamples.repeat_distribution_not_sound"]

[rust]
files = [
  "crates/nose-normalize/src/value_graph/state.rs",
  "crates/nose-normalize/src/interp.rs",
  "crates/nose-normalize/src/interp/ops.rs",
]
symbols = ["add_values_not_concat", "join_strings"]

[lean]
proof = "Proof.lean"
theorems = [
  "NoseFreeMonoid.concat_assoc",
  "NoseFreeMonoid.concat_left_id",
  "NoseFreeMonoid.concat_right_id",
  "NoseFreeMonoid.repeat_two_eq_concat_self",
]
counterexamples = "Counterexamples.lean"
counterexample_theorems = [
  "NoseFreeMonoidCounterexamples.concat_not_commutative",
  "NoseFreeMonoidCounterexamples.repeat_distribution_not_sound",
]
