id = "normalize.value_graph.field_writes"
kind = "soundness-boundary"
summary = "Value-graph field writes are interpreted as final receiver+field state with last-write-wins semantics."

[claim]
id = "nose.claim.normalize.value_graph.field_writes"

[theorem]
status = "proven"
statement = "Value-graph field writes are interpreted as final receiver+field state with last-write-wins semantics."
model = "The Lean declarations listed in [lean] define the modeled theorem boundary."

[preconditions.receiver_place_identity]
kind = "runtime"
status = "empirical"
summary = "Receiver and field coordinates must resolve to the exact place represented by the field-state key."
evidence = ["crates/nose-cli/tests/equivalence.rs"]

[preconditions.write_order_and_aliasing]
kind = "runtime"
status = "empirical"
summary = "Rust state tracking must preserve last-write order and invalidate reads when receiver aliasing is unknown."
evidence = ["crates/nose-cli/tests/equivalence.rs"]

[product]
surface = "exact-normalization"
guarantee = "Shares an exact fingerprint only when the recorded runtime preconditions admit the modeled theorem."

[evidence]
executable_tests = ["crates/nose-cli/tests/equivalence.rs"]
counterexamples = ["formal/obligations/normalize/value_graph/field_writes/Counterexamples.lean#NoseFieldWriteCounterexamples.same_field_write_order_matters"]

[rust]
files = [
  "crates/nose-normalize/src/value_graph/model.rs",
  "crates/nose-normalize/src/value_graph/field_state.rs",
  "crates/nose-normalize/src/interp.rs",
]
symbols = ["FieldStateKey", "flush_fields", "field_env"]

[lean]
proof = "Proof.lean"
theorems = [
  "NoseFieldWrites.same_field_last_write_wins",
  "NoseFieldWrites.different_field_writes_commute",
]
counterexamples = "Counterexamples.lean"
counterexample_theorems = ["NoseFieldWriteCounterexamples.same_field_write_order_matters"]
