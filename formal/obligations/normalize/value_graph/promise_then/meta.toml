id = "normalize.value_graph.promise_then"
kind = "soundness"
summary = "A settled fulfilled Promise is modeled by its resolved value, so `p.then(λr. body r)` is the continuation applied to that value. The local Promise slice also models fulfilled/rejected channels for dependency-closed first-party `Promise.resolve`, `Promise.reject`, `.then`, and `.catch`: handler-returned `Promise.resolve` flattens, handler-returned `Promise.reject` preserves the rejected channel, and `catch(h)` agrees with `then(undefined, h)` for rejected local producers. Thenable assimilation, `.finally`, aggregates, custom receivers, and scheduling remain outside this proof and fail closed."

[claim]
id = "nose.claim.normalize.value_graph.promise_then"

[theorem]
status = "proven"
statement = "A settled fulfilled Promise is modeled by its resolved value, so `p.then(λr. body r)` is the continuation applied to that value. The local Promise slice also models fulfilled/rejected channels for dependency-closed first-party `Promise.resolve`, `Promise.reject`, `.then`, and `.catch`: handler-returned `Promise.resolve` flattens, handler-returned `Promise.reject` preserves the rejected channel, and `catch(h)` agrees with `then(undefined, h)` for rejected local producers. Thenable assimilation, `.finally`, aggregates, custom receivers, and scheduling remain outside this proof and fail closed."
