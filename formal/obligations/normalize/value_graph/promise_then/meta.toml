id = "normalize.value_graph.promise_then"
kind = "soundness"
summary = "A settled fulfilled Promise is modeled by its resolved value, so `p.then(λr. body r)` is the continuation applied to that value. The local Promise slice also models fulfilled/rejected channels for dependency-closed first-party `Promise.resolve`, `Promise.reject`, `.then`, and `.catch`. Safe `.finally` and literal aggregates are separately registered empirical exact claims."

[claim]
id = "nose.claim.normalize.value_graph.promise_then"

[theorem]
status = "proven"
statement = "For the modeled settled Promise channel, `.then` applies the selected continuation, returned Promise states preserve or flatten their channel, and `.catch(h)` agrees with `then(undefined, h)` on a rejected local producer."
model = "The Lean declarations listed in [lean] define the modeled theorem boundary."

[preconditions.promise_api_identity]
kind = "runtime"
status = "empirical"
summary = "The receiver and .then/.catch selector must resolve to the admitted first-party Promise contract."
evidence = ["crates/nose-cli/tests/equivalence.rs"]

[preconditions.settled_state_recovery]
kind = "runtime"
status = "empirical"
summary = "The receiver must recover a dependency-closed fulfilled or rejected state with a safe payload."
evidence = ["crates/nose-cli/tests/equivalence.rs"]

[preconditions.handler_and_thenable_safety]
kind = "runtime"
status = "empirical"
summary = "Continuation binding, effects, return channel, and possible thenable assimilation must fit the modeled handler boundary."
evidence = ["crates/nose-cli/tests/equivalence.rs"]

[product]
surface = "exact-normalization"
guarantee = "Shares an exact fingerprint only when the recorded runtime preconditions admit the modeled theorem."

[evidence]
executable_tests = ["crates/nose-cli/tests/equivalence.rs"]
counterexamples = []

[rust]
rule_module = true
files = ["crates/nose-normalize/src/value_graph/rules/promise_then.rs"]
symbols = ["apply"]

[lean]
proof = "Proof.lean"
theorems = [
  "NosePromiseThen.then_eq_await_bind",
  "NosePromiseThen.then_chain",
  "NosePromiseThen.returned_resolve_flattens",
  "NosePromiseThen.returned_reject_preserves_channel",
  "NosePromiseThen.catch_recovers_rejected",
  "NosePromiseThen.catch_eq_then_rejection_handler",
]
