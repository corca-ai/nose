id = "normalize.value_graph.clamp"
kind = "soundness"
summary = "Clamp min/max compositions and two-comparison forms agree only under the lo <= hi precondition."

[claim]
id = "nose.claim.normalize.value_graph.clamp"

[theorem]
status = "proven"
statement = "Clamp min/max compositions and two-comparison forms agree only under the lo <= hi precondition."
model = "The Lean declarations listed in [lean] define the modeled theorem boundary."

[preconditions.rust_model_correspondence]
kind = "runtime"
status = "empirical"
summary = "Rust admission must establish the modeled domain, shape, binding, and effect hypotheses before emitting this exact normalization."
evidence = ["crates/nose-cli/tests/equivalence.rs"]

[product]
surface = "exact-normalization"
guarantee = "Shares an exact fingerprint only when the recorded runtime preconditions admit the modeled theorem."

[evidence]
executable_tests = ["crates/nose-cli/tests/equivalence.rs"]
counterexamples = ["formal/obligations/normalize/value_graph/clamp/Counterexamples.lean#NoseClampCounterexamples.swapped_bounds_not_clamp", "formal/obligations/normalize/value_graph/clamp/Counterexamples.lean#NoseClampCounterexamples.wrong_nesting_not_clamp", "formal/obligations/normalize/value_graph/clamp/Counterexamples.lean#NoseClampCounterexamples.precondition_required"]

