id = "il.arena.deep_copy"
kind = "structural-invariant"
summary = "Deep-copying a subtree into a fresh IL builder keeps old ids valid and gives the copied root an in-bounds id."

[claim]
id = "nose.claim.il.arena.deep_copy"

[theorem]
status = "proven"
statement = "Deep-copying a subtree into a fresh IL builder keeps old ids valid and gives the copied root an in-bounds id."
model = "The Lean declarations listed in [lean] define the modeled theorem boundary."

[preconditions.source_subtree_validity]
kind = "runtime"
status = "empirical"
summary = "The copied source root and its traversed child edges must be valid in the source arena."
evidence = ["crates/nose-il/src/tests.rs"]

[preconditions.fresh_builder_indexing]
kind = "runtime"
status = "empirical"
summary = "The destination builder must append copied nodes without invalidating existing ids and return the copied in-bounds root."
evidence = ["crates/nose-detect/src/fragment/oracle/tests.rs"]

[product]
surface = "structural-invariant"
guarantee = "Rejects malformed IL or preserves arena validity at the listed structural boundary."

[evidence]
executable_tests = ["crates/nose-il/src/tests.rs"]
counterexamples = []

[rust]
files = ["crates/nose-detect/src/fragment/oracle.rs"]
symbols = ["copy_subtree", "synthesize_wrapper"]

[lean]
proof = "Proof.lean"
theorems = [
  "NoseIlArenaDeepCopy.copy_preserves_existing_bounds",
  "NoseIlArenaDeepCopy.copied_root_is_in_bounds",
]
