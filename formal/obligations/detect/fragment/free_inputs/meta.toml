id = "detect.fragment.free_inputs"
kind = "soundness-boundary"
summary = "Fragment wrapper inputs are exactly reads from the enclosing scope with fragment-local bindings removed."

[claim]
id = "nose.claim.detect.fragment.free_inputs"

[theorem]
status = "proven"
statement = "Fragment wrapper inputs are exactly reads from the enclosing scope with fragment-local bindings removed."
model = "The Lean declarations listed in [lean] define the modeled theorem boundary."

[preconditions.lexical_read_collection]
kind = "runtime"
status = "empirical"
summary = "The extractor must collect every enclosing-scope read that the synthesized fragment can observe."
evidence = ["crates/nose-detect/src/fragment/oracle/tests.rs"]

[preconditions.local_binding_subtraction]
kind = "runtime"
status = "empirical"
summary = "Parameters and fragment-local binding targets must be removed without hiding a captured outer referent."
evidence = ["crates/nose-detect/src/fragment/oracle/tests.rs"]

[product]
surface = "verification-boundary"
guarantee = "Bounds behavioral verification to fragments satisfying the recorded contract."

[evidence]
executable_tests = ["crates/nose-detect/src/fragment/oracle/tests.rs"]
counterexamples = []

[rust]
files = ["crates/nose-detect/src/fragment/oracle.rs"]
symbols = ["free_input_cids", "collect_bound_cids", "collect_binding_targets"]

[lean]
proof = "Proof.lean"
theorems = [
  "NoseFragmentFreeInputs.free_inputs_are_reads_not_bound",
  "NoseFragmentFreeInputs.free_input_reads_subset",
  "NoseFragmentFreeInputs.bound_cids_are_removed",
]
