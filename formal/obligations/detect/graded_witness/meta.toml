id = "detect.graded_witness"
kind = "soundness"
summary = "The graded witness has a proven anti-unification theorem and separately recorded empirical referent, decorator, sink, and async grade-demotion checks."

[claim]
id = "nose.claim.detect.graded_witness"

[theorem]
status = "proven"
statement = "Both inputs match their anti-unification pattern, and a hole-free anti-unification implies equality of the modeled terms."
model = "Lean models abstract operation/leaf identity and binary term anti-unification; it does not model source binding, decorators, sink extraction, or async lifecycle."

[preconditions.referent_identity]
kind = "runtime"
status = "empirical"
summary = "A referent mismatch demotes equal-modulo-holes while retaining the explanatory near witness."
evidence = ["crates/nose-detect/src/witness/tests.rs#disjoint_referents_demote_the_witness"]

[preconditions.decorator_identity]
kind = "runtime"
status = "empirical"
summary = "A definition-site decorator difference is attached as a witness hole and demotes equal-modulo-holes."
evidence = ["crates/nose-cli/src/main_tests/surface_hints.rs#decorator_difference_detects_arg_changes"]

[preconditions.sink_alignment]
kind = "runtime"
status = "empirical"
summary = "An unmatched return or effect sink remains visible as a superset pattern and demotes equal-modulo-holes."
evidence = ["crates/nose-detect/src/witness/tests.rs#extra_return_sink_is_a_superset_pattern"]

[preconditions.async_lifecycle]
kind = "runtime"
status = "empirical"
summary = "A one-sided async boundary remains reportable as an async mirror but never behavioral equality."
evidence = ["crates/nose-detect/src/witness/tests.rs#async_await_aligns_with_sync_twin_as_async_mirror"]

[product]
surface = "near-witness"
guarantee = "Reports structural similarity with explicit caveats; equal-modulo-holes survives only when referent, decorator, sink, and async demotion checks allow it."

[evidence]
executable_tests = ["crates/nose-detect/src/witness/tests.rs", "crates/nose-cli/src/main_tests/surface_hints.rs"]
counterexamples = ["crates/nose-detect/src/witness/tests.rs#disjoint_referents_demote_the_witness", "crates/nose-detect/src/witness/tests.rs#extra_return_sink_is_a_superset_pattern", "crates/nose-detect/src/witness/tests.rs#async_await_aligns_with_sync_twin_as_async_mirror"]

[rust]
files = [
  "crates/nose-detect/src/witness.rs",
  "crates/nose-detect/src/witness/analysis.rs",
  "crates/nose-detect/src/witness/anti_unify.rs",
  "crates/nose-detect/src/witness/dag.rs",
  "crates/nose-detect/src/witness/model.rs",
]
symbols = ["graded_witness", "equal_modulo_holes", "compare_referents"]

[lean]
proof = "Proof.lean"
theorems = [
  "NoseGradedWitness.au_matches_left",
  "NoseGradedWitness.au_matches_right",
  "NoseGradedWitness.holefree_au_eq",
]
